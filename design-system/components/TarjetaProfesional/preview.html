<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Tarjeta profesional</title>
<style>
  html,body{margin:0}
  body{background:var(--papel);color:var(--tinta);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
  *{box-sizing:border-box}
  .mk path{fill:currentColor}
  .ic{width:20px;height:20px;flex:none}
  .lbl{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave);margin:0 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
  .ab{position:relative;overflow:hidden;flex:none}
  .ab>.in{position:absolute;top:0;left:0;transform-origin:0 0}

  .card{width:1020px;height:660px;border-radius:24px;padding:72px;font-family:var(--font-sans);display:flex;flex-direction:column;position:relative;overflow:hidden}
  .fr{background:var(--marca-pino);color:var(--marca-papel)}
  .fr .mk{width:150px;height:150px;color:var(--marca-lila)}
  .fr .nm{font-size:64px;line-height:64px;font-weight:600;letter-spacing:-.015em;margin:auto 0 16px}
  .fr .ro{font-size:22px;line-height:28px;letter-spacing:.16em;font-weight:500;text-transform:uppercase;margin:0;color:var(--marca-lila)}
  .fr .tb2{position:absolute;right:72px;bottom:72px;display:grid;grid-template-columns:repeat(5,28px);gap:10px}
  .fr .tb2 i{height:28px;border-radius:5px;border:2px solid var(--marca-lila)} .fr .tb2 i.hecho{background:var(--marca-lila)}
  .bk{background:var(--marca-papel);color:var(--marca-tinta)}
  .bk .nm{font-size:48px;line-height:52px;font-weight:600;letter-spacing:-.012em;margin:0}
  .bk .ro{font-size:24px;line-height:32px;margin:8px 0 0;color:var(--marca-pino);font-weight:500}
  .bk .tp{font-size:20px;line-height:26px;color:var(--marca-gris);margin:6px 0 0}
  .bk .ct{margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:10px 28px;font-size:25px;line-height:34px}
  .bk .ct span:nth-child(odd){font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:var(--marca-gris);font-weight:500;line-height:34px}
  .bk .corner{position:absolute;right:72px;top:72px;width:80px;height:80px;color:var(--marca-pino)}
  .bk .ar{position:absolute;right:72px;bottom:72px;display:flex;gap:14px;color:var(--marca-pino)}
  .bk .ar .ic{width:34px;height:34px}
  .shadow{box-shadow:var(--sombra-tarjeta);border-radius:6px}
</style>
</head>
<body>
<div class="row"><div><p class="lbl">Frente · 85 × 55 mm</p><div class="shadow"><div class="ab" style="width:346.8px;height:224.4px;border-radius:8px"><div class="in" style="width:1020px;height:660px;transform:scale(0.34)"><div class="card fr"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><path d="M6 8 L58 8 L58 14 L6 14Z M28.5 14 L35.5 14 L53.5 57 L46 57 L32 23.5 L18 57 L10.5 57Z M21 40.5 L43 40.5 L43 46 L21 46Z"/></svg><p class="nm">Tania Arroyo</p><p class="ro">Abogada · Procesalista civil</p><div class="tb2"><i class="hecho"></i><i class="hecho"></i><i class="hecho"></i><i class="hecho"></i><i></i></div></div></div></div></div></div><div><p class="lbl">Dorso</p><div class="shadow"><div class="ab" style="width:346.8px;height:224.4px;border-radius:8px"><div class="in" style="width:1020px;height:660px;transform:scale(0.34)"><div class="card bk"><svg class="corner mk" viewBox="0 0 64 64" aria-hidden="true"><path d="M6 8 L58 8 L58 14 L6 14Z M28.5 14 L35.5 14 L53.5 57 L46 57 L32 23.5 L18 57 L10.5 57Z M21 40.5 L43 40.5 L43 46 L21 46Z"/></svg><p class="nm">Tania Arroyo</p><p class="ro">Abogada · Procesalista civil</p><p class="tp">T.P. 000.000 del C. S. de la J.</p><div class="ct"><span>Tel</span><span>+57 300 000 0000</span><span>Correo</span><span>hola@taniaarroyo.co</span><span>IG</span><span>@taniaarroyo.abogada</span></div><div class="ar"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 6h7l2 2h9v11H3z"/><path d="M7 12h10M7 15.5h6"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 8h18v11H3z"/><path d="M9 8V5h6v3M3 13h18"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><circle cx="8" cy="7" r="2.5"/><circle cx="16" cy="7" r="2.5"/><path d="M3.5 19v-3.5a4.5 4.5 0 0 1 9 0V19M11.5 19v-3.5a4.5 4.5 0 0 1 9 0V19"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><circle cx="12" cy="4.5" r="2"/><circle cx="5" cy="19.5" r="2"/><circle cx="12" cy="19.5" r="2"/><circle cx="19" cy="19.5" r="2"/><path d="M12 6.5v11M5 17.5V12h14v5.5"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 11h8M8 14h8M8 18c1.5-1.5 2.5 1 4 0s2 0 3 0"/></svg></div></div></div></div></div></div></div><p class="lbl" style="margin-top:14px">Datos de ejemplo: reemplace T.P., teléfono y correo reales antes de imprimir.</p>
</body>
</html>
