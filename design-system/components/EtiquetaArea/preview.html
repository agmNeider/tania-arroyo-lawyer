<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Etiqueta de área</title>
<style>
  html,body{margin:0}
  body{background:var(--papel);color:var(--tinta);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:20px}
  *{box-sizing:border-box}
  .mk path,.wm path{fill:currentColor}
  .wm{display:block;height:auto}
  .ic{width:20px;height:20px;flex:none}
  .lbl{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave);margin:0 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
  .ab{position:relative;overflow:hidden;flex:none}
  .ab>.in{position:absolute;top:0;left:0;transform-origin:0 0}

  .chip{display:inline-flex;align-items:center;gap:var(--space-2);padding:6px 12px 6px 8px;border-radius:var(--radius-sm);background:var(--menta);color:var(--tinta);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .chip .ic{width:18px;height:18px;color:var(--pino)}
  .chip.main{background:var(--pino);color:var(--on-pino)} .chip.main .ic{color:var(--on-pino)}
  .row{gap:10px}
  .icons{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;color:var(--pino)}
  .icons .ic{width:32px;height:32px}
  .state{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:500;padding:3px 10px;border-radius:var(--radius-pill);border:1px solid currentColor}
  .ok{color:var(--cumplido)} .warn{color:var(--plazo)}
</style>
</head>

os</span></div><div class="icons"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 6h7l2 2h9v11H3z"/><path d="M7 12h10M7 15.5h6"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 6h16M12 6v14M8 20h8"/><path d="M6 6l-3 7h6zM18 6l-3 7h6z"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 8h18v11H3z"/><path d="M9 8V5h6v3M3 13h18"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><circle cx="8" cy="7" r="2.5"/><circle cx="16" cy="7" r="2.5"/><path d="M3.5 19v-3.5a4.5 4.5 0 0 1 9 0V19M11.5 19v-3.5a4.5 4.5 0 0 1 9 0V19"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><circle cx="12" cy="4.5" r="2"/><circle cx="5" cy="19.5" r="2"/><circle cx="12" cy="19.5" r="2"/><circle cx="19" cy="19.5" r="2"/><path d="M12 6.5v11M5 17.5V12h14v5.5"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 11h8M8 14h8M8 18c1.5-1.5 2.5 1 4 0s2 0 3 0"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 5h18v15H3zM3 10h18M8 3v4M16 3v4"/><path d="M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/></svg><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></div><div class="row" style="margin-top:20px"><span class="state ok">● Término cumplido</span><span class="state warn">● Vence en 3 días hábiles</span></div>
